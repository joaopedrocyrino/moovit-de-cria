name: Build and deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cria-production-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci && npm ci --prefix frontend
      - run: dotnet restore MoovitDeCria.slnx --locked-mode
      - run: dotnet build MoovitDeCria.slnx -c Release --no-restore
      - run: dotnet test --solution MoovitDeCria.slnx -c Release --no-build --no-restore
      - run: npm run test:web
      - run: python3 -m unittest discover -s tests/python
      - run: npm run build --prefix frontend
      - name: Build monolith
        env:
          GTFS_URL: ${{ vars.GTFS_URL || 'https://dados.mobilidade.rio/gtfs/schedule' }}
        run: |
          printf 'APP_IMAGE=ghcr.io/%s:%s\n' "${GITHUB_REPOSITORY,,}" "$GITHUB_SHA" >> "$GITHUB_ENV"
          docker build --build-arg PREPARE_GTFS=1 --build-arg GTFS_URL="$GTFS_URL" -t "ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA" .
      - name: Browser integration
        run: |
          python3 tests/python/create_fixture.py --output .data/transit.sqlite
          docker compose up -d --no-build app
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Publish tested image
        id: publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$APP_IMAGE"
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$APP_IMAGE")
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
      - if: always()
        run: docker compose down
  deploy:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      CADDY_CONTAINER: ${{ vars.CADDY_CONTAINER }}
      APP_HOSTNAME: ${{ vars.APP_HOSTNAME }}
      APP_IMAGE: ${{ needs.release.outputs.image }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash scripts/deploy-production.sh
