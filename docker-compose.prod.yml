name: moovit-de-cria
services:
  app:
    image: ${APP_IMAGE:?Use the release image digest}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Transit__Database: /data/transit.sqlite
      Geocoding__AutocompleteUrl: ${AUTOCOMPLETE_URL:-https://photon.komoot.io}
      Transit__VehiclesUrl: ${VEHICLES_URL:-https://its.mobilidade.rio/v1/geolocalizacao/veiculos}
      Geocoding__BaseUrl: ${GEOCODING_URL:-https://nominatim.openstreetmap.org}
      Geocoding__UserAgent: ${GEOCODING_USER_AGENT:-MoovitDeCria/1.0 (+https://github.com/joaopedrocyrino)}
      Security__TrustedProxyIp: ${TRUSTED_PROXY_IP:?Deployment discovers Caddy IP}
      AllowedHosts: ${APP_HOSTNAME:?Set the production hostname};localhost;127.0.0.1
      DOTNET_gcServer: '0'
    volumes: ["transit_data:/data:ro"]
    networks: [proxy, outbound]
    expose: ['8080']
    labels:
      caddy: ${APP_HOSTNAME:?Set the production hostname}
      caddy.reverse_proxy: '{{upstreams 8080}}'
      caddy_ingress_network: proxy
    mem_limit: ${APP_MEMORY_LIMIT:-512m}
    read_only: true
    tmpfs: ["/tmp:size=67108864,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  import:
    profiles: [tools]
    image: ${APP_IMAGE:?Use the release image digest}
    user: '0:0'
    entrypoint: [python3, /app/scripts/import_gtfs.py]
    command: [--snapshot, /app/snapshot/transit.sqlite, --output, /data/transit.sqlite]
    environment:
      GTFS_URL: ${GTFS_URL:-https://dados.mobilidade.rio/gtfs/schedule}
    volumes: ["transit_data:/data"]
    networks: [outbound]
    mem_limit: ${IMPORT_MEMORY_LIMIT:-384m}
networks:
  proxy:
    name: proxy
    external: true
  outbound: {}
volumes:
  transit_data:
